<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="快速使用、个性化与当前验证边界"><rect width="1200" height="900" fill="#F7F6F2"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="64" y="66" font-size="18" fill="#35765E" font-weight="600">START / CUSTOMIZE</text><text x="64" y="135" font-size="46" fill="#202D2A" font-weight="600">给一个选题，就可以开始</text><rect x="64" y="174" width="1072" height="216" rx="20" fill="#202D2A"/><text x="92" y="220" font-size="26" fill="#FFFFFF" font-weight="500">使用 $matt-xhs-studio 制作一套小红书图文。</text><text x="92" y="267" font-size="25" fill="#EEF2EC" font-weight="400">主题：忙了一周，却说不清自己做了什么。</text><text x="92" y="311" font-size="25" fill="#EEF2EC" font-weight="400">受众：想建立每周复盘习惯的上班族。</text><text x="92" y="355" font-size="25" fill="#EEF2EC" font-weight="400">目标：先表达共鸣，再给轻量的整理建议。</text><text x="64" y="446" font-size="28" fill="#202D2A" font-weight="600">导入整个技能文件夹</text><text x="64" y="485" font-size="23" fill="#61706B" font-weight="400">保持 SKILL.md、references、templates 在同一目录中。</text><rect x="64" y="520" width="340" height="132" rx="16" fill="white"/><text x="86" y="555" font-size="25" fill="#35765E" font-weight="600">改内容</text><text x="86" y="595" font-size="18" fill="#202D2A" font-weight="400">references/editorial.md</text><text x="86" y="626" font-size="19" fill="#61706B" font-weight="400">语气、策划和确认边界</text><rect x="430" y="520" width="340" height="132" rx="16" fill="white"/><text x="452" y="555" font-size="25" fill="#35765E" font-weight="600">改视觉</text><text x="452" y="595" font-size="18" fill="#202D2A" font-weight="400">references/design.md</text><text x="452" y="626" font-size="19" fill="#61706B" font-weight="400">配色、字体、插画和布局</text><rect x="796" y="520" width="340" height="132" rx="16" fill="white"/><text x="818" y="555" font-size="25" fill="#35765E" font-weight="600">改交付</text><text x="818" y="595" font-size="18" fill="#202D2A" font-weight="400">references/production.md</text><text x="818" y="626" font-size="19" fill="#61706B" font-weight="400">检查、记录和文件组织</text><text x="64" y="711" font-size="27" fill="#202D2A" font-weight="600">使用边界</text><text x="64" y="752" font-size="23" fill="#61706B" font-weight="400">图片生成依赖宿主工具；技能不包含模型、密钥或跨对话记忆。</text><text x="64" y="793" font-size="23" fill="#61706B" font-weight="400">当前为预览版：规划示例不是成品，端到端图片效果尚未验证。</text><text x="64" y="858" font-size="19" fill="#35765E" font-weight="400">维护者 matt  /  MIT  /  详细说明与开发边界见下方文档链接</text></g></svg>