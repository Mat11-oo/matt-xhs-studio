<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="工作流程：内容、设计、样图、交付"><rect width="1200" height="900" fill="#F7F6F2"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif"><text x="64" y="66" font-size="18" fill="#35765E" font-weight="600">HOW IT WORKS</text><text x="64" y="135" font-size="43" fill="#202D2A" font-weight="600">少问关键问题，把精力留给内容</text><text x="64" y="184" font-size="24" fill="#61706B" font-weight="400">不填固定问卷，不重复确认已经明确的决定。</text><rect x="64" y="230" width="1072" height="118" rx="18" fill="white"/><rect x="84" y="254" width="70" height="70" rx="18" fill="#E2ECE4"/><text x="101" y="299" font-size="30" fill="#35765E" font-weight="600">01</text><text x="181" y="269" font-size="27" fill="#202D2A" font-weight="600">整理内容</text><text x="181" y="304" font-size="22" fill="#202D2A" font-weight="400">明确一个核心问题，重组叙事与逐页重点。</text><text x="181" y="332" font-size="19" fill="#61706B" font-weight="400">新增核心判断、关键事实或立场变化时才确认。</text><rect x="64" y="367" width="1072" height="118" rx="18" fill="white"/><rect x="84" y="391" width="70" height="70" rx="18" fill="#E2ECE4"/><text x="101" y="436" font-size="30" fill="#35765E" font-weight="600">02</text><text x="181" y="406" font-size="27" fill="#202D2A" font-weight="600">建立设计语言</text><text x="181" y="441" font-size="22" fill="#202D2A" font-weight="400">浅色底 + 一种强调色，字体与组件保持统一。</text><text x="181" y="469" font-size="19" fill="#61706B" font-weight="400">图解、插画、真实素材按内容搭配。</text><rect x="64" y="504" width="1072" height="118" rx="18" fill="white"/><rect x="84" y="528" width="70" height="70" rx="18" fill="#E2ECE4"/><text x="101" y="573" font-size="30" fill="#35765E" font-weight="600">03</text><text x="181" y="543" font-size="27" fill="#202D2A" font-weight="600">先看代表性样图</text><text x="181" y="578" font-size="22" fill="#202D2A" font-weight="400">首次确定风格先展示一张；明确跳过则直接做。</text><text x="181" y="606" font-size="19" fill="#61706B" font-weight="400">后续只有能访问已确认记录时才沿用。</text><rect x="64" y="641" width="1072" height="118" rx="18" fill="white"/><rect x="84" y="665" width="70" height="70" rx="18" fill="#E2ECE4"/><text x="101" y="710" font-size="30" fill="#35765E" font-weight="600">04</text><text x="181" y="680" font-size="27" fill="#202D2A" font-weight="600">检查后交付</text><text x="181" y="715" font-size="22" fill="#202D2A" font-weight="400">核对中文、实际画幅、裁切与手机阅读效果。</text><text x="181" y="743" font-size="19" fill="#61706B" font-weight="400">交付图片、标题正文、标签及可复用记录。</text><rect x="64" y="808" width="1072" height="52" rx="12" fill="#E2ECE4"/><text x="88" y="842" font-size="22" fill="#35765E" font-weight="400">局部意见直接修改；重大方向未明确时，用具体示例帮助决定。</text></g></svg>